# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect this repo, set Root Directory to "backend" or use Blueprint.
services:
  - type: web
    name: boq-automation-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
